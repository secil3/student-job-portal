name: student-job-portal-demo

services:
  mysql-demo:
    image: mysql:8.0
    container_name: student-job-portal-demo-mysql
    ports:
      - "${DEMO_MYSQL_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: student_job_portal_demo
      MYSQL_USER: ${DEMO_MYSQL_USER:?required}
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:?required}
    volumes:
      - demo_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./docker/mysql/demo-init.sql:/docker-entrypoint-initdb.d/002-demo-init.sql:ro

volumes:
  demo_mysql_data:
    name: student-job-portal_demo_mysql_data
